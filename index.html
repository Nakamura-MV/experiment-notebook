<!doctype html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link rel="manifest" href="manifest.json">
        <meta name="theme-color" content="#ffffff">

        <link rel="icon" href="icons/icon-192-v2.png" type="image/png">

        <link rel="stylesheet" href="style.css">
        <title>電子実験ノート</title>
    </head>

    <body>
        <section id="page-list-screen">
            <div class="home-header">
                <h1>実験ノート</h1>

                <div class="home-data-actions">
                    <button id="export-json-button" type="button" disabled>
                        保存
                    </button>

                    <button id="import-json-button" type="button" disabled>
                        復元
                    </button>
                </div>
            </div>

            <button id="create-page-button" type="button" disabled>
                新規ページを作成
            </button>

            <input id="import-json-file" type="file" accept="application/json,.json" hidden>

            <ul id="page-list"></ul>
        </section>

        <section id="page-detail-screen" hidden>
            <div class="page-actions" role="group" aria-label="ページ操作">
                <button id="back-to-list-button" type="button">一覧</button>
                <button id="export-page-json-button" type="button">ページを保存</button>
                <button id="export-page-MD-button" type="button">MD化</button>
                <button id="delete-page-button" class="danger-button" type="button">削除</button>
            </div>

            <input id="experiment-title" type="text" aria-label="ページタイトル">

            <p id="page-title-status"></p>

            <div id="entry-list"></div>
            <p>
                <label for="entry-body">記録内容</label>
                <time id="draft-time"></time>
                <textarea id="entry-body" rows="4"></textarea>
            </p>
            <button id="add-entry-button" type="button">追加</button>
        </section>

        <script src="app.js"></script>

    </body>

</html>
